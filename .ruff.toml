# Настройка линтера Ruff для IDvjPy_term (запуск: ruff check src/ tests/ app.py backup_db.py)
# В CI не входит (там тесты через pytest); держит анализ локально и в редакторе стабильным.
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # длинные строки — существующий стиль; не enforced
    "E402",   # в src/app.py импорты внутри try-блока ради понятного сообщения о зависимости
    "BLE001", # «слепой» `except Exception` — намеренный паттерн «UI не должен падать»
    "DTZ005", # наивные локальные даты нормальны для этого терминального приложения
    "EXE001", # шебанги оставлены для наглядности; файлы запускают через `python3`
]

[lint.per-file-ignores]
"tests/**" = ["B011"] # обычные assert в тестах; pytest всё равно их переписывает
