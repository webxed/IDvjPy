name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Подряд идущие пуши отменяют предыдущий прогон — минуты не жгутся зря.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Один джоб на весь набор упирался в 30-минутный лимит: сейчас 1321 тест,
    # локально ~25 минут. Раскладываем файлы по параллельным джобам — жадно,
    # по числу собранных тестов: маркер `slow` про время больше не говорит
    # (он всего на 430 тестах из 1321, а остальные 891, включая Pilot, — это
    # само по себе ~15 минут). Баланс по числу тестов — прокси, а не замер:
    # точные числа даёт `--durations=15` в логе, по ним раскладку можно уточнить.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          # Сбор тестов по файлам (0.6 с) + жадная раскладка по шардам:
          # файл уходит в самый лёгкий бин. Так шарды ровные (~220 тестов)
          # без новых зависимостей и без xdist (Pilot-тесты к параллелизму
          # внутри одного раннера чувствительны). Число шардов берём из самого
          # matrix (`strategy.job-total`) — иначе при правке списка шардов
          # лишние шарды получали бы пустой список и молча пропускали тесты.
          files=$(python3 -m pytest tests/ --collect-only -q 2>/dev/null \
            | grep '^tests/' | cut -d: -f1 | sort | uniq -c | sort -rn \
            | awk -v s=${{ matrix.shard }} -v n=${{ strategy.job-total }} '
                { best = 1; for (b = 2; b <= n; b++) if (load[b] < load[best]) best = b;
                  load[best] += $1;
                  if (best == s) out = out " " $2 }
                END { print out }')
          # Пустой список — не «весь набор»: в pytest.ini есть `testpaths = tests`.
          [ -n "$files" ] || { echo "shard ${{ matrix.shard }}: нет файлов"; exit 1; }
          echo "shard ${{ matrix.shard }}/${{ strategy.job-total }}: $(echo "$files" | wc -w) files"
          echo "$files" | tr ' ' '\n' | sed 's/^/  /'
          # --timeout bounds a single hanging test; the plugin ships in requirements-dev.txt.
          python -m pytest $files -q --timeout=600 --durations=15

  docker-demo:
    # Демостенд (docker/README.md): собираем образ и проверяем, что стенд
    # действительно заводится — провижининг, посев, идемпотентность, TUI под pty.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: idvjpy-demo:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: First run provisions /data and seeds the tag library
        run: |
          docker run --rm -v idvjpy-ci:/data idvjpy-demo:ci --help > /tmp/first.log 2>&1
          cat /tmp/first.log
          grep -q "settings.yml ← src/settings/" /tmp/first.log
          grep -q "llm_providers.yml ← src/llm_providers/" /tmp/first.log
          grep -q "наполняю библиотеку тегов" /tmp/first.log
          grep -q "^usage: app.py" /tmp/first.log  # аргументы дошли до приложения

      - name: Library is populated in the volume
        run: |
          docker run --rm -v idvjpy-ci:/data --entrypoint python3 idvjpy-demo:ci -c 'import sys; sys.path.insert(0, "/app/src"); import database_v2 as db; s = db.usage_stats("/data/mytags.db"); print("library:", s["live"], "commands,", s["tags"], "tags"); assert s["live"] > 100 and s["tags"] > 10, s'

      - name: Second run keeps the volume (no reseed, no seed backups)
        run: |
          docker run --rm -v idvjpy-ci:/data idvjpy-demo:ci --help > /tmp/second.log 2>&1
          if grep -q "наполняю библиотеку тегов" /tmp/second.log; then
            echo "::error::the library was seeded again on the second run"
            exit 1
          fi
          # Снимки, сделанные самим посевом, не должны оставаться в стартовом состоянии.
          docker run --rm -v idvjpy-ci:/data --entrypoint sh idvjpy-demo:ci -c 'test ! -d /data/backups'

      - name: TUI renders under a pty and the short tour exits cleanly
        # В CI нет терминала, а Textual требует tty — tui-smoke.py создаёт pty сам.
        run: |
          docker run --rm -v idvjpy-ci:/data --entrypoint python3 idvjpy-demo:ci \
            /usr/local/bin/tui-smoke.py --expect IDvjPy_term --timeout 180 \
              -- /usr/local/bin/idvjpy-demo --demo short --demo-quit

      - name: The all tour (calc/ipcalc/JSON/tags/tools) plays under a pty
        # Самый полный bundled-тур, без сети и кластера; ускоряем вдвое для CI.
        run: |
          docker run --rm -v idvjpy-ci:/data --entrypoint python3 idvjpy-demo:ci \
            /usr/local/bin/tui-smoke.py --expect IDvjPy_term --timeout 300 \
              -- /usr/local/bin/idvjpy-demo --demo all --demo-speed 2 --demo-quit
