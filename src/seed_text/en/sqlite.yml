      11: purge soft-deleted rows (changes the DB)
      12: shrink the file after deletion (changes the file)
      13: database integrity
      14: SQL dump of the DB to mytags.sql (into the current directory)
      15: 'interactive sqlite3 (better: > sqlite3 $DBFILE)'
  sqlstat:
    comment: library database overview
