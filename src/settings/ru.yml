# IDvjPy_term — настройки по умолчанию (шаблон, русский).
#
# Шаблоны лежат в src/settings/<lang>.yml. При первом запуске в новом data-каталоге
# приложение копирует сюда файл языка, выбранного в режиме auto (--lang /
# $IDVJPY_LANG → системная локаль → en), — комментарии будут на вашем языке.
# Ключ `language` оставлен `auto`: интерфейс следует системной локали; сменить —
# `:lang <код>`.
#
# Портативный режим: если settings.yml уже есть в каталоге запуска — берётся он,
# шаблон не трогается. Личный settings.yml в git не попадает (.gitignore).
#
# Все относительные пути — от data-каталога (settings рядом с БД/history).

# Максимум строк в буфере вывода.
max_lines: 100000

# История ввода: сколько последних строк держать и показывать.
history_lines: 20
# Хвост истории остаётся последовательностью; старые дубликаты уходят. 0 = выкл. :h compact
history_keep: 500

# Подсказки из history_*.txt при наборе обычной команды (в т.ч. строк,
# начинающихся с `@` и `>`): выбрать можно любую, вставка — Tab/Enter.
# false — только ↑ и :h /text.
history_completion: true

# Опечатка (`command not found`, код 127) убирается из history_*.txt и из ленты
# сессии (↑): ошибка остаётся в журнале, но ↑ / `:h` не подсовывают несуществующую
# команду. Считается только 127 **вместе** с «command not found» в stderr —
# `bash -c 'exit 127'` остаётся. false — такие строки хранятся как любые другие.
history_forget_not_found: true

# Вызовы каких `:`-команд писать в history_*.txt (↑ / `:h`), но не показывать
# в подсказках: это запросы и навигация, а не команды для повтора. Имена — без
# `:`; можно строкой через запятую (`history_queries: llm, run`). Пусто (`[]`),
# `false` или `null` — выключено: вызовы `:`-команд в историю не пишутся.
# Аргументы обязательны: одиночное `:llm` без вопроса в истории не останется.
history_queries:
  - llm
  - cht
  - rg
  - md
  - run
  - send
  - send!

# Каталог документов для `:rg` — поиска по markdown (напр. Obsidian-vault).
# Пусто — текущий каталог; `~` раскрывается. Разово: `:rg текст ~/vault`.
md_dir: ""

# Порог форматированного `:md`: файлы длиннее открываются исходником (raw) в
# Line-API просмотрщике (поиск `/`, n/N, переход к строке) — мгновенно.
# Форматированный Markdown дорог на больших файлах (13k строк ≈ 40 с).
# Поднимите, если нужно форматирование и большой файл (и готовы ждать).
md_render_lines: 1000

# Конвертер документов (`:md notes.docx`, `:md report.pdf` → markdown).
# Пусто — автопоиск: anydoc → markitdown → pandoc. `pip install firecrawl-anydoc`
# покрывает docx/xlsx/pptx/doc/ppt/xls/pdf/rtf/epub/odt без лишних зависимостей
# и читает PDF локально. Markdown кэшируется в mdcache/ (в каталоге данных).
md_converter: ""

# Файл БД с тегами (относительно data-каталога).
database_tags_file: mytags.db
# Каталог снимков БД (:backup, --seed).
backup_dir: backups

# Таймаут выполнения команды (секунды). 0 = без таймаута (tsh login, долгие команды).
command_timeout: 10

# Протокол мыши в TUI: true — клик выделяет блок, колесо крутит журнал;
# false — выделение текста мышью в терминале (клик по блоку не фокусирует).
# Если параметр отсутствует, используется true.
terminal_mouse: true

# Цветовая тема TUI. `d` переключает textual-dark / textual-light и сохраняет сюда.
# Другие имена: :theme  (nord, dracula, gruvbox, catppuccin-mocha, …).
# matrix — своя тема приложения: зелёный фосфор на почти чёрном (как в скринсейвере),
# вместе с ней рамки ввода/подсказок/справки становятся зелёными.
theme: textual-dark

# Язык интерфейса (en, ru, zh): каталоги текстов в src/locales (en — источник правды,
# ru/zh — переводы; недостающие ключи падают на en). `:lang` показывает и меняет язык и
# сохраняет его сюда; `auto` — по $LANG/$LC_ALL. Флаги --lang и $IDVJPY_LANG
# переопределяют разово. Команды, имена тегов и ключи настроек не переводятся.
# Комментарии уже посеянной библиотеки меняет `:relang <код>` (снимок БД в backups/).
language: auto

# Сверять VERSION с GitHub main при старте. :update проверяет всегда.
check_updates: true

# Скринсейвер. Секунды простоя; 0 = выкл. :screensaver — сразу.
screensaver_idle: 120
# Холст заставки: true — «матричный дождь» (падающие столбцы глифов, как в «Матрице»),
# false — звёздное поле (тогда действует screensaver_stars). Лента сверху, справка и
# load/RAM снизу остаются в обоих случаях. Переключить на раз в TUI:
# `:screensaver matrix` / `:screensaver stars`.
screensaver_matrix: true
# Летающие звёзды звёздного поля (пыль + k8s/git/…). false — чёрный холст; часы, лента и
# load остаются. На матричный холст не влияет. Также есть `:screensaver stars`.
screensaver_stars: true

# Подсказки имён k8s-ресурсов из живого кластера (`kubectl get pod <Tab>`).
k8s_completion: false

# Файловые подсказки в автодополнении:
#   auto  — явные пути (`./`, `/`, `~/`) плюс голое имя файла у команд,
#           работающих с файлами (cat/vim/…); у grep/sed/awk/jq — только со
#           второго аргумента, ведь первый — шаблон (`grep ot` не листит
#           cwd); у kubectl/docker/git и т.п. — тоже без мусора из cwd;
#           контекст считается по текущему сегменту: в `cat f | grep ot`
#           файлы подсказывает grep, а не cat;
#   paths — только явные пути и cd/pushd;
#   off   — файловые подсказки выключены.
file_completion: auto

# Переменные «кластерного журнала» (:kctx, файл kctx.json): присваивание любой
# из них запоминает набор для текущего кластера, они же показываются в списках
# :kctx и возвращаются по :kctx N (`:kctx <cluster> [N]`).
# Список имён — как здесь или строкой через запятую (`kctx_vars: NS, RELEASE`);
# `[]` / `false` / `null` — журнал выключен полностью (снимки не пишутся).
# Порядок имён — это же порядок в списках `:kctx` и в строке `$NS=…`.
# По умолчанию — стек bundled-шаблонов: kubectl (NS…QUOTA) и helm
# (RELEASE, CHART, VALUES — тег `hvars`).
# NB: в снимок попадают только непустые значения — `:kctx N` вернёт их же.
kctx_vars:
  - NS
  - POD
  - DEPLOY
  - SVC
  - ING
  - APP
  - CTR
  - QUOTA
  - RELEASE
  - CHART
  - VALUES

# Рендер блоков журнала через Textual Line API (render_line) вместо одного
# большого Static. Разметка парсится один раз, перерисовка зависит от числа
# видимых строк — быстрее на больших блоках и при построчном курсоре.
# true (по умолчанию) — Line API; false — прежний рендер. Переключить без правки
# файла: IDVJPY_LINE_BLOCKS=0 / =1 в окружении.
line_api_blocks: true

# Статичный источник для `:import` без аргументов — общая (командная) библиотека
# тегов в JSON (её делает `backup_db.py export` — вся библиотека).
# Принимается только https://; перед импортом показывается план (`--dry`).
# Пусто — выключено: `:import` тогда требует явный файл или ссылку.
library_url: ""

# `:cht` — справки cheat.sh. Базовый URL сервиса и опции запроса (по умолчанию
# T — без ANSI-цветов; можно добавить Q — без комментариев, например "QT").
cheat_sh_url: https://cht.sh
cheat_sh_options: T

# Ответ `:llm` рисовать форматированным markdown (Rich Markdown) вместо плоского
# текста. true (по умолчанию) — заголовки/списки/код/таблицы; false — моноширинный
# текст, как у обычной команды. F6 (простой режим) отключает markdown разово.
# Простой режим F6 выключает цвета разово (обещание режима — плоский текст).
llm_render_markdown: true

# ANSI/ESC в выводе команд: true (по умолчанию) — SGR-коды (`\x1b[..m`) становятся
# цветами блока, как в терминале (curl wttr.in, ls --color=always, цветной grep).
# Прочие последовательности (курсор, стирание, OSC/гиперссылки) и управляющие
# символы вырезаются всегда, `\r`-перерисовка (прогресс-бары) сворачивается до
# итоговой строки — иначе терминал исполнял бы их внутри кадра TUI и ломал вывод.
# false — весь вывод плоский. F6 выключает цвета разово.
# Плоский текст (`:w`, F3, `|`, `$OUT`/`$BLOCK`, `:log`, `@key`) не зависит от ключа.
ansi_colors: true

# Очищать буфер обмена, если в него извлекли значение секрета в строку `$$NAME=…`.
# true — после такой вставки CLIPBOARD/PRIMARY очищаются (секрет не остаётся в буфере);
# false (по умолчанию) — буфер не трогаем.
clear_clipboard_after_secret: false

# Внешний редактор для `:ed <файл>|$OUT|$BLOCK` (запуск в TTY, TUI на паузе).
# Может содержать аргументы: `editor: code --wait`, `editor: nvim`. Пусто/нет —
# берётся $VISUAL / $EDITOR, затем системный редактор (sensible-editor, nano, vi).
editor: nano
