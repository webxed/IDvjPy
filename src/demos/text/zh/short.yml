title: IDvjPy 简短导览
captions:
  0: 帮助 —— 前缀与键盘快捷键
  1: 普通命令 → 日志中的块
  2: 变量保存在 .bashrc_term 中
  4: 日志中的 JSON —— 然后 F5
  5: 保存命令模板
  8: 标签库
  9: '预览：引用将如何展开'
  10: 前缀 ! 插入文本，尚不执行
  11: 第二次 Enter —— 执行组装的行
  12: 用 !! 组装一条链
  14: 聚焦最后一个块
  15: JSON 查看器（F5），Esc 关闭
  17: 行光标模式 —— Enter 把该行复制到输入
  19: 把一条笔记写入历史，而不执行
