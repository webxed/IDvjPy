# Русский каталог текстов. Источник правды — en.yml: здесь нужны только
# переведённые ключи, отсутствующие падают на английский (см. src/i18n.py).
# Разметку ([bold]…[/]) и подстановки ({name}) сохранять как в en.yml.

startup:
  session_row: "[bold]session:[/] [bold #67e8f9]{session}[/]   [dim]:session NAME — переключить  ·  :new — другое окно[/]"
  tagline: "теги → шаблоны → командная строка"
  assemble: "[bold]{bang}[/] / [bold]!![/] собирают строку, [bold]Enter[/] запускает.  Полная справка: [bold]:?[/]"
  keys:
    - "[bold]:?[/] справка  [bold]:q[/] выход  [bold]:h[/] история  [bold]:c[/] очистить  [bold]:welcome[/] seed"
    - "[bold]#tag cmd[/] сохранить    [bold]?[/] / [bold]??[/] теги БД     [bold]{bang}[/] вставить"
    - "[bold]$VAR=val[/] переменная   [bold]$OUT[/] последняя строка блока   [bold]| cmd[/] пайп"
    - "[bold]Tab[/] журнал  [bold]F2[/] строки  [bold]F3[/] копия  [bold]F5[/] JSON  [bold]d[/] / [bold]:theme[/] тема"

session:
  usage: "Usage: :session NAME   |   :new [NAME|-] [DIR] — окно в отдельном терминале"

scope:
  usage: "Использование: :scope add <группа|тег>… (оставить только это)  |  :scope rm <группа|тег>… (скрыть это)\n       :scope clear | :scope all (показать всё)  |  :scope (что сейчас)\nГруппы: linux, k8s, git, … — канонические наборы сидов; имя может быть и тегом."
  status_all: "[bold]Scope:[/bold] фильтра нет — в списках все теги.\n  :scope add <группа|тег>… — оставить только это; :scope rm … — скрыть это."
  status: "[bold]Scope:[/bold] {label}\n  видимых тегов: {visible}, скрытых: {hidden}. Показать всё: :scope clear"
  applied: "[bold]Scope применён:[/bold] {label}\n  видимых тегов: {visible}, скрытых: {hidden}. Показать всё: :scope clear"
  cleared: "Scope снят: в списках снова все теги."
  unknown: "Неизвестная группа или тег: {names}. Группы: {groups}."
  mode_conflict: "Scope уже '{current}' — сначала :scope clear, потом '{wanted}'."
  save_failed: "Scope включён, но {file} записать не удалось — после перезапуска он пропадёт."
  broken_file: "Scope: {error} — файл игнорирую, в списках все теги."
  section: "Scope: {label} — видимых тегов: {visible}, скрытых: {hidden}. Показать всё: :scope clear"
  stats_note: "[dim]Scope: {label} — :stats показывает всю библиотеку; :scope clear вернёт всё[/dim]"
  in_session: "  Scope: {label} (:scope clear — показать всё)"

kctx:
  "off": "Журнал выключен: kctx_vars: [] в settings.yml."
  set_vars: "Задайте переменные журнала ({names}) — они запишутся в журнал."
  no_list: "kctx: нет открытого списка снимков. Сначала ':kctx <cluster>', или сразу ':kctx <cluster> N'."
  usage: "Usage: :kctx [cluster [N]] — N — номер снимка из списка"
  clusters_title: "[bold]kctx — кластеры из журнала:[/bold]"
  empty: "(пусто)"
  login_hint: "Войдите в кластер (klogin … / tsh kube login … / kubectl config use-context …)"
  cluster_row: "{i}. {cluster}  ({n} сн.)  {when}{marker}"
  bullet_row: "• {cluster}  (0 сн.){marker}"
  current_marker: " ← текущий"
  list_hint: ":kctx <cluster> — войти и показать снимки (один набор — применится сразу); :kctx <cluster> N — войти и применить N"
  snapshots_title: "[bold]kctx — {cluster}: снимки переменных:[/bold]"
  no_snapshots: "(снимков нет)"
  apply_hint: ":kctx N — применить набор N"
  no_set: "kctx: набора {index} нет у '{cluster}' (в журнале {rows})."
  empty_vars: "(пусто)"
  application: "kctx {cluster} #{index}: {text}"
  single_set: "[dim](единственный набор — применился сразу)[/dim]"
  logged_cluster: "(кластер входа: {before} — примените ':kctx {cluster}', чтобы переключить)"

watch:
  usage: "Usage: :watch <sec> <command>"
  usage_stop: "Usage: :watch <sec> <command>   (stop: :watch stop)"
  usage_seconds: "Usage: :watch <sec> <command>  (sec — число секунд)"
  usage_positive: "Usage: :watch <sec> <command>  (sec должен быть > 0)"
  runbook_running: "Идёт прогон цепочки — остановите его: :run stop (или Esc)."
  running: "[dim]watch: {command} · каждые {interval}s · F4 / :kill / :watch stop — остановить[/dim]"

safe:
  usage: "Использование: :safe [on|off]  (без аргумента — показать состояние)"
  status: "Безопасный режим: {state} (settings.yml: safe_mode; :safe on|off)"
  saved: "Безопасный режим: {state} (только эта сессия)"
  state_on: "включён"
  state_off: "выключен"
  cancelled: "Безопасный режим: запуск отменён."
  confirm_title: "Безопасный режим: подтвердите запуск"
  confirm_risks: "Распознанный риск: {risks}"
  confirm_hint: "Enter — выполнить именно эту команду · Esc — отмена"

runbook:
  modes: "auto — выполнить и ждать завершения · manual — вставить и ждать Enter (пустой Enter — пропустить) · prompt — набрать строку"
  no_directives: "в теге нет run:-директив — все шаги пойдут auto; мутирующий шаг безопаснее пометить run:manual (см. :? run)"
  plan_footer_stop: "Esc — остановка"
  plan_footer_dry: "[yellow]сухой прогон — ничего не выполняется[/yellow]"
  plan_head: "[bold]Runbook {title}[/bold] · шагов: {steps} · {footer}"
  plan_source: "[dim]источник: {source} · пауза {pause:g}с[/dim]"
  plan_note: "[yellow]заметка: {warning}[/yellow]"
  usage_header: "Usage: :run <tag|file.yml> [--step] [--dry]   |   :run stop"
  usage_notes:
    - "  auto-шаги идут подряд, manual/prompt ждут человека, Esc — остановить."
    - "  Режим шага тега — директивы в комментарии команды: run:manual,"
    - "  run:prompt, run:pause=2, run:continue (см. :? run)."
  tags_title: "Теги с run:-директивами в библиотеке:"
  no_tags: "Пока ни один тег не несёт run:-директив."
  tag_missing: "Runbook: тег '{name}' не найден или без живых команд. `?tag` — библиотека, `:run` — usage."
  pause_warning: "{token}: нужна пауза > 0 секунды — пропущено"
  manual_hint: "Enter — выполнить · пустой Enter — пропустить шаг · Esc — остановить прогон"
  prompt_hint: "Наберите строку и нажмите Enter · Esc — остановить прогон"
  continue_hint: "[dim]{label} · дальше — вручную или `:run {source} --step`[/dim]"
  stopped: "Runbook {title}: остановлен на шаге {index}/{total}. Можно печатать."
  done: "Runbook {title}: шагов выполнено — {total}."
  safe_cancelled: "Безопасный режим: runbook отменён перед рискованным шагом."

llm:
  offline: "[offline] Встроенная заглушка IDvjPy_term: запрос в сеть не уходил.\nТак проверяются :llm и :llm ask без ключей; настоящие ответы — у провайдеров из llm_providers.yml."
  answer_language: "Russian"

lang:
  usage: "Язык: {current}\nДоступны: {available}\nСменить: :lang <code>  (auto — по $LANG / $LC_ALL)\nСохраняется в settings.yml (ключ `language`); новый язык применяется к тексту, напечатанному после смены."
  unknown: "Неизвестный язык: {name}. Список — :lang."
  saved: "Язык: {name} (сохранён в settings.yml)"
  session_only: "Язык: {name} (только эта сессия)"

relang:
  usage: "Перевести комментарии засеянной библиотеки на другой язык.\nТекущий UI: {current}\nДоступны: {available}\nСменить: :relang <code>  (auto — по $LANG / $LC_ALL)\nТрогает только канонические теги и команды сидов; ваши теги, команды и правленые комментарии остаются. Перед записью — снимок БД в backups/."
  unknown: "Неизвестный язык: {name}. Список — :relang."
