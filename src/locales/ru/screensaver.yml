screensaver:
  help:
  - :?  — полная справка по командам
  - :q  — выход
  - :w file  — записать журнал в файл
  - :h [N]  — последние N строк истории
  - :h /text  — поиск по истории в автодополнении
  - ":h import [shell]  — дописать историю оболочки в историю сессии"
  - :c  — очистить блоки журнала
  - :json  — просмотрщик JSON (последний блок или файл)
  - ":md file|path[#L n]  — Markdown: справочник или путь; документы (docx/pdf/…) конвертируются"
  - :rg pat [dir]  — поиск по .md (ripgrep/встроенный); клик по path:line
  - :cd [path]  — показать или сменить cwd шелла (БД тегов остаётся в каталоге запуска)
  - :fm [path]  — файловый менеджер ОС (новое окно)
  - :term [--tab|--window] [path]  — системный терминал (окно или вкладка — term_open)
  - :env  — перечитать .bashrc_term* в этот процесс
  - :session [NAME]  — показать или переключить экземпляр
  - :session new [NAME] [DIR]  — окно приложения в новом терминале
  - :new [NAME|-] [DIR]  — окно приложения в новом терминале (свой экземпляр)
  - :send <session|*> cmd  — переслать команду другому экземпляру (:send! выполняет её)
  - :welcome  — каталог seed
  - :backup  — снимок БД тегов
  - :vault  — хранилище секретов с шифрованием по паролю (init/add/cp/use/exec)
  - ":screensaver  — «матричный дождь» сразу (по умолчанию) или звёзды; простой: screensaver_idle"
  - :r [N]  — перенести команду блока во ввод (N = насколько назад)
  - :cmd [N] [show]  — команда блока с текущими $VAR/секретами в буфер
  - ":name label  — метка блока для |@label"
  - ":log [N]  — полный вывод блока: / — поиск, f — только совпадения (F7)"
  - :kill [all]  — остановить фоновые команды (группа SIGTERM)
  - :watch N cmd  — перезапускать команду каждые N секунд в одном блоке
  - :stats  — запуски по тегам, топ команд, ни разу не запущенные
  - :mv tag[1] tag2 | :mv tag tag2  — перенести команду / переименовать тег
  - ":scope add|rm|clear  — оставить/скрыть теги в списках и подсказках"
  - :export <tag>|* [file]  — один тег в JSON / вся библиотека в Markdown
  - ":import f.json|url  — вставить команды (без аргумента = library_url)"
  - :alias <tag>|* [file.sh]  — команды как bash-функции
  - :diff  — unified diff двух выводов блоков
  - :o [N] | :o /text  — история вывода сессии / поиск
  - :llm [provider] msg  — спросить LLM (провайдер по умолчанию; $OUT / $BLOCK)
  - :llm offline msg  — встроенная заглушка (без сети, без ключа)
  - :llm ask [provider] task  — задача + библиотека тегов → ссылки !tag[tid]
  - :cht query  — справка cheat.sh в журнале
  - ":lang код  — язык интерфейса (сохраняется); :relang — перевести комментарии сидов"
  - ":ed [file|$OUT|$BLOCK]  — внешний редактор (TUI на паузе; editor: в settings.yml)"
  - ":kctx [cluster] [N]  — журнал кластера: сохранённые переменные по кластеру (kctx_vars)"
  - :/text · :g  — поиск по строкам журнала; :n / :N вперёд/назад
  - :theme [name]  — тема TUI (сохраняется в settings.yml)
  - :playbook [file]  — выгрузить сессию как YAML для --demo
  - :run tag|file.yml  — полуавтоматическая цепочка; ручные шаги ждут Enter
  - :update  — сравнить VERSION с GitHub main
  - :i  — анализатор Kubernetes Ingress
  - "> cmd  — настоящий TTY (htop, vim, ssh); env/$PWD возвращаются"
  - "@ cmd  — запуск без command_timeout (долгие не-TTY задачи)"
  - "& cmd  — отдельное окно/вкладка терминала; TUI продолжает работать"
  - "#tag cmd  — сохранить шаблон как есть (ссылки не раскрываются)"
  - "# command  — отложить строку в историю, не выполнять"
  - "#tag- / #tag!  — мягко удалить / вернуть тег"
  - "? / ??  — запросить теги; ?text = поиск по содержимому команд"
  - "!tag[tid]  — вставить шаблон (не выполнять)"
  - "!!  — собрать ссылки в строку ввода"
  - "| cmd  — передать stdout сфокусированного блока"
  - $VAR=val  — задать env в .bashrc_term_<instance>
  - $VAR=@key  — взять значение из строки сфокусированного блока (колонка ключа)
  - $$VAR=val  — СЕКРЕТНАЯ env-переменная (скрыта в журнале, не уходит в :llm)
  - $OUT / $BLOCK  — последняя строка / весь stdout блока-источника
  - Enter  — выполнить собранную строку; ! / !! только вставляют
  - Tab  — фокус на последний блок журнала (из ввода)
  - F2 line-cursor · F3 copy · F4 stop · F5 JSON · F6 simple · F7 full output  — клавиши журнала
