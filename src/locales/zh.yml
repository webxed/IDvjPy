# UI text catalogue — Simplified Chinese (zh). Keys mirror src/locales/en.yml
# (the source of truth); only the values are translated.
#
# * keys are dotted paths; `t("kctx.off")` reads `kctx: { off: ... }`
# * `{name}` are str.format placeholders; `{interval:g}` keeps format specs
# * Textual/Rich markup ([bold]…[/]) is part of a value wherever the template
#   needs it — keep it when translating
# * layout indentation is added by the code, not baked into values
# * commands, tag names, settings keys and file names are never translated

startup:
  session_row: "[bold]会话:[/] [bold #67e8f9]{session}[/]   [dim]:session NAME — 切换  ·  :new — 新窗口[/]"
  tagline: "标签 → 模板 → 命令行"
  assemble: "[bold]{bang}[/] / [bold]!![/] 组装命令行，[bold]Enter[/] 执行。完整帮助：[bold]:?[/]"
  keys:
    - "[bold]:?[/] 帮助  [bold]:q[/] 退出  [bold]:h[/] 历史  [bold]:c[/] 清空  [bold]:welcome[/] 种子目录"
    - "[bold]#tag cmd[/] 保存    [bold]?[/] / [bold]??[/] 数据库标签     [bold]{bang}[/] 插入"
    - "[bold]$VAR=val[/] 变量   [bold]$OUT[/] 上一块最后一行   [bold]| cmd[/] 管道"
    - "[bold]Tab[/] 日志  [bold]F2[/] 行  [bold]F3[/] 复制  [bold]F5[/] JSON  [bold]d[/] / [bold]:theme[/] 主题"

session:
  usage: "用法: :session NAME   |   :new [NAME|-] [DIR] — 在独立终端中打开窗口"

