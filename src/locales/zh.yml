  usage_notes:
    - "  auto 步骤依次执行，manual/prompt 等待你操作，Esc 停止。"
    - "  标签的步骤模式来自命令注释中的指令: run:manual、"
    - "  run:prompt、run:pause=2、run:continue（见 :? run）。"
  tags_title: "库中带运行手册的标签:"
  no_tags: "还没有标签带有 run: 指令。"
  tag_missing: "运行手册: 标签 '{name}' 未找到或没有可用命令。`?tag` — 库，`:run` — 用法。"
  pause_warning: "{token}: pause 必须 > 0 秒 — 已跳过"
  manual_hint: "Enter — 执行 · 空 Enter — 跳过该步骤 · Esc — 停止运行"
  prompt_hint: "输入该行并按 Enter · Esc — 停止运行"
