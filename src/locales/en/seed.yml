# Welcome catalog (`:welcome`, empty DB) — English source of truth.
# Descriptions are keyed by the seed script without `seed_` / `.py`
# (`seed_git.py` → `git`), so `catalog.desc.git` is the one-line hint.
# Commands, script names and handbook file names are never translated.

catalog:
  title: "Empty command database"
  tags_empty: "[bold]Tags are empty.[/]  Your own: [bold #4a8c58]#tag cmd[/]"
  seed_note: "[dim]Each --seed replaces only its own tags; a DB copy goes to backups/ first. By hand:[/] [bold]:backup[/]"
  click_hint: "Click a green command — it goes to the input, [bold]Enter[/], then [bold]??[/] [dim](or ~5 s).[/]"
  md_hint: "[dim]Click a .md name (terminal_mouse needed) or[/] [bold]:md file.md[/][dim] — the handbook with formatting.[/]"
  show_again: "[dim]Show this catalog again:[/] [bold]:welcome[/]"
  section_core: "Core"
  section_ops_all: "All ops at once"
  section_ops_all_note: "(except linux / k8s / git)"
  section_ops: "Ops one by one"
  overview_title: "Sections"
  overview_hint: "?tag · ?? · :welcome — seed catalog"
  custom: "own"
  desc:
    linux_commands: "Linux: proc, file, net, kube"
    k8s_chains: "k8s investigation chains: kpod, klog, kavail, kstore, …"
    git: "git: status, diff, branches; gstat / gsync"
    docker: "docker / compose: dck, dcmp, dps, dlog"
    helm: "helm: releases, values, dry-run; hls"
