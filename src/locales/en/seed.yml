    disk: "disks: df, du, lsblk, smartctl, ncdu"
    systemd: "systemd: systemctl, journalctl, dmesg; sstat"
    sysinfo: "host, lsof, strace; hstat / lport / pdbg"
    sysstat: "sysstat: vmstat, iostat, mpstat; oload"
    vault: "HashiCorp Vault: status, kv metadata"
    text: "text: grep, awk, sed"
