  bad_var: "Bad variable name: {name}"
  used: "{name} → ${var}{comment} for this session (the journal and history never see the value)"
  exec_preset: "For {name} no $VAR was given and the program is not recognised. Say it explicitly: :vault exec {name}=VAR -- <command>. Known programs: {presets}"
  exec_note: "Running with ${var} from {name} (value hidden): {command}"
  stdin_note: "Feeding {name} to stdin (value hidden): {command}"

md:
  converting: "[dim]Converting {name} → markdown…[/dim]"
  converted: "Converted {name} → markdown: {lines} line(s) via {converter}."
  from_cache: "cache"
  no_converter: "Not a text file — a document needs a converter.\nInstall one: {hint}\nor set `md_converter` in settings.yml."
  converter_missing: "Converter '{name}' is not available — install it or fix `md_converter` in settings.yml."
  empty: "{name}: the converter ({converter}) produced no text."
  failed: "Could not convert {name}: {error}"
  needs_ocr: "{name}: scanned pages, no text layer — OCR is needed. Local engine (nothing leaves the machine): {hint}; `md_ocr` in settings.yml disables it or adds options (e.g. ocrmypdf -l rus)."
  ocr_missing: "{name}: OCR tool '{tool}' is not available — install it (apt/dnf/apk/brew ocrmypdf) or clear `md_ocr` in settings.yml."
  ocr_language: "{name}: tesseract has no language data for '{code}' — install the pack (apt install tesseract-ocr-{code}) or set your own language in `md_ocr` (e.g. ocrmypdf -l eng)."
  timeout: "Conversion of {name} timed out ({seconds}s)."

exit:
  cwd_note: "the app left you in {cwd}, your shell is still where it was — run in it: {hint} (a wrapper with $IDVJPY_CWD_FILE does this itself)"
