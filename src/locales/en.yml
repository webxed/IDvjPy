# UI text catalogue — English is the source of truth (see src/i18n.py).
#
# * keys are dotted paths; `t("kctx.off")` reads `kctx: { off: ... }`
# * `{name}` are str.format placeholders; `{interval:g}` keeps format specs
# * Textual/Rich markup ([bold]…[/]) is part of a value wherever the template
#   needs it — keep it when translating
# * layout indentation is added by the code, not baked into values
# * commands, tag names, settings keys and file names are never translated

startup:
  session_row: "[bold]session:[/] [bold #67e8f9]{session}[/]   [dim]:session NAME — switch  ·  :new — another window[/]"
  tagline: "tags → templates → command line"
  assemble: "[bold]{bang}[/] / [bold]!![/] assemble the line, [bold]Enter[/] runs it.  Full help: [bold]:?[/]"
  keys:
    - "[bold]:?[/] help  [bold]:q[/] quit  [bold]:h[/] history  [bold]:c[/] clear  [bold]:welcome[/] seed"
    - "[bold]#tag cmd[/] save    [bold]?[/] / [bold]??[/] DB tags     [bold]{bang}[/] insert"
    - "[bold]$VAR=val[/] variable   [bold]$OUT[/] last block line   [bold]| cmd[/] pipe"
    - "[bold]Tab[/] journal  [bold]F2[/] lines  [bold]F3[/] copy  [bold]F5[/] JSON  [bold]d[/] / [bold]:theme[/] theme"

session:
  usage: "Usage: :session NAME   |   :new [NAME|-] [DIR] — a window in a separate terminal"

